# Render Blueprint - TEMPLATE UNTUK BELAJAR UPDATE
# Beda dengan render.yaml di main:
#   - branch = template/render-update (bukan main)
#   - healthCheckPath = "/" (tidak butuh Neon / DATABASE_URL)
#   - service name = elcica-template (tidak bentrok dengan elcica-api)
services:
  - type: web
    name: elcica-template
    runtime: rust
    plan: free
    branch: template/render-update
    buildCommand: cargo build --release
    startCommand: ./target/release/elcica
    healthCheckPath: /
    envVars:
      - key: RUST_LOG
        value: info
