name: Backup Neon

on:
  schedule:
    - cron: '0 17 * * *'   # 00:00 WIB tiap hari
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump + gzip
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: pg_dump "$DATABASE_URL" --no-owner --no-privileges -Fp | gzip > backup.sql.gz

      - uses: actions/upload-artifact@v7
        with:
          name: neon-backup
          path: backup.sql.gz
          retention-days: 7
